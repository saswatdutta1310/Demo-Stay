name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: |
          npm run prisma:generate --if-present

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Validate client configurations
        run: npm run client:validate

      - name: Build
        run: npm run build
        env:
          CLIENT: gayatree-stay
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/hotel_demo_db?schema=public"
          RAZORPAY_KEY_ID: "rzp_test_YourTestKeyIdHere"
          RAZORPAY_KEY_SECRET: "YourRazorpaySecretKeyHere"
          JWT_SECRET: "your_jwt_secret_change_in_production"
          OWNER_PIN: "1234"
          API_URL: "http://localhost:5000/api/v1"
          WEB_URL: "http://localhost:3000"
